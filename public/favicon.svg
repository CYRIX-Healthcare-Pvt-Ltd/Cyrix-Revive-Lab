<!--
  The Cyrix mark: the X from the Cyrix Health Care logo itself, black and red,
  on a white rounded square (the user, 12 Oct: "this same x needed in icon,
  same no change"; "update new in all tab icon also").

  One file, and the same file, in every Cyrix app. They share a database, a
  sign-in and a tab strip, so an icon that changes between modules tells a
  person something has changed when nothing has.

  The X is cut from the supplied lockup artwork (cyrix-logo.png), not redrawn,
  so it cannot drift from the logo. The ground is white in both themes,
  because the mark is red and black and black needs a light ground.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#ffffff"/><image width="64" height="64" href="data:image/png;base64," xlink:href="data:image/png;base64,"/></svg>
